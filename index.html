<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Shadow Walk Vault</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-main: #e0e0e0;
            --text-muted: #9aa0a6;
            --amber-color: #ffbf00;
            --border-color: #333;
            --badge-era: #2c3e50;
            --badge-env: #1e4620;
            --badge-struct: #4a2c40;
            --badge-comp-managed: #233345;
            --badge-comp-managed-border: #5e81ac;
            --badge-comp-ext: #3d2f1a;
            --badge-comp-ext-border: #d08770;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.25rem;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        h1 { margin: 0; color: var(--amber-color); }
        .result-count {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        input[type="text"], select {
            padding: 0.65rem 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            min-width: 170px;
            flex-grow: 1;
        }
        input[type="text"]:focus, select:focus {
            outline: 1px solid var(--amber-color);
        }
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 0.85rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .toggle-label input {
            accent-color: var(--amber-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .card-img-wrap {
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
            background-color: #0b0b0d;
        }
        .compendium-pill {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0.22rem 0.6rem;
            border-radius: 999px;
            background-color: rgba(35, 51, 69, 0.92);
            border: 1px solid var(--badge-comp-managed-border);
            color: #9ed4e6;
            backdrop-filter: blur(4px);
        }
        .compendium-pill.external {
            background-color: rgba(61, 47, 26, 0.94);
            border-color: var(--badge-comp-ext-border);
            color: #f3d28f;
        }
        .card-content {
            padding: 1.15rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .card-title {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-main);
        }
        .meta-dims {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .lore-link {
            color: var(--amber-color);
            text-decoration: none;
            font-size: 0.78rem;
        }
        .lore-link:hover { text-decoration: underline; }
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            color: #f0f0f0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .badge.era { background-color: var(--badge-era); }
        .badge.env { background-color: var(--badge-env); }
        .badge.struct { background-color: var(--badge-struct); }

        .summary {
            font-size: 0.92rem;
            line-height: 1.45;
            margin: 0;
            color: #d0d4da;
        }
        .features-box {
            margin-top: auto;
            background: #151518;
            padding: 0.65rem 0.75rem;
            border-radius: 4px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-left: 3px solid var(--amber-color);
        }
        .features-box strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Shadow Walk Vault</h1>
            <div class="result-count" id="resultCount">Loading vault...</div>
        </div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search title, summary, features, or compendium...">
            <select id="compendiumFilter">
                <option value="all">All Compendiums</option>
            </select>
            <select id="eraFilter">
                <option value="all">All Eras</option>
            </select>
            <select id="environmentFilter">
                <option value="all">All Environments</option>
            </select>
            <select id="structureFilter">
                <option value="all">All Structures</option>
            </select>
            <label class="toggle-label">
                <input type="checkbox" id="curatedOnly" checked>
                Curated Only
            </label>
        </div>
    </header>

    <div class="grid" id="mapGrid"></div>

    <script>
        let vaultData = [];
        let taxonomy = { eras: [], environments: [], structures: [] };

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getCompendiumName(map) {
            return (map.compendium || 'Shadow Vault').trim();
        }

        async function loadVault() {
            try {
                const [taxRes, mapRes] = await Promise.all([
                    fetch('taxonomy.json'),
                    fetch('amber_map_index.json')
                ]);
                taxonomy = await taxRes.json();
                vaultData = await mapRes.json();

                populateDropdowns();
                filterMaps();
            } catch (error) {
                document.getElementById('mapGrid').innerHTML =
                    `<p style="color:#ff6b6b;">Error loading taxonomy.json or amber_map_index.json. Make sure both files are in the same folder.</p>`;
            }
        }

        function populateDropdowns() {
            const compSelect = document.getElementById('compendiumFilter');
            const compCounts = new Map();
            vaultData.forEach(m => {
                const c = getCompendiumName(m);
                compCounts.set(c, (compCounts.get(c) || 0) + 1);
            });
            const compNames = Array.from(compCounts.keys()).sort((a, b) => {
                if (a === 'Shadow Vault') return -1;
                if (b === 'Shadow Vault') return 1;
                return a.localeCompare(b);
            });
            compNames.forEach(c => compSelect.add(new Option(`${c} (${compCounts.get(c)})`, c)));

            const eraSelect = document.getElementById('eraFilter');
            (taxonomy.eras || []).forEach(era => eraSelect.add(new Option(era, era)));

            const envSelect = document.getElementById('environmentFilter');
            (taxonomy.environments || []).forEach(env => envSelect.add(new Option(env, env)));

            const structSelect = document.getElementById('structureFilter');
            (taxonomy.structures || []).forEach(struct => structSelect.add(new Option(struct, struct)));
        }

        function renderGrid(maps) {
            const grid = document.getElementById('mapGrid');
            const curatedTotal = vaultData.filter(m => m.curated).length;
            document.getElementById('resultCount').textContent =
                `Showing ${maps.length} maps (${curatedTotal} / ${vaultData.length} curated)`;

            if (maps.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">No maps found matching your criteria.</p>';
                return;
            }

            const html = maps.map(map => {
                const imgFile = map.thumb_filename || map.filename;
                const compName = getCompendiumName(map);
                const isExternal = map.managed_by_vault === false;
                const eraBadges = (map.eras || []).map(t => `<span class="badge era">${escapeHtml(t)}</span>`).join('');
                const envBadges = (map.environments || []).map(t => `<span class="badge env">${escapeHtml(t)}</span>`).join('');
                const structBadges = (map.structures || []).map(t => `<span class="badge struct">${escapeHtml(t)}</span>`).join('');
                const allBadges = eraBadges + envBadges + structBadges;

                const featuresHtml = (map.features && map.features.length > 0)
                    ? `<div class="features-box"><strong>Features:</strong> ${escapeHtml(map.features.join(', '))}</div>`
                    : '';

                const loreLinkHtml = map.source_url
                    ? `<a class="lore-link" href="${escapeHtml(map.source_url)}" target="_blank" rel="noopener noreferrer">Lore ↗</a>`
                    : '';

                return `
                    <div class="card">
                        <div class="card-img-wrap">
                            <img src="thumbnails/${encodeURIComponent(imgFile)}" alt="${escapeHtml(map.title || map.filename)}" class="card-img" loading="lazy">
                            <span class="compendium-pill${isExternal ? ' external' : ''}">${escapeHtml(compName)}</span>
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${escapeHtml(map.title || map.filename)}</h2>
                            <div class="meta-dims">
                                <span>${map.width || '?'}x${map.height || '?'} px &middot; Grid: ${map.grid_size || 100}px</span>
                                ${loreLinkHtml}
                            </div>
                            ${allBadges ? `<div class="badge-group">${allBadges}</div>` : ''}
                            <p class="summary">${escapeHtml(map.summary || 'No summary yet.')}</p>
                            ${featuresHtml}
                        </div>
                    </div>
                `;
            }).join('');

            grid.innerHTML = html;
        }

        function filterMaps() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const compendium = document.getElementById('compendiumFilter').value;
            const era = document.getElementById('eraFilter').value;
            const env = document.getElementById('environmentFilter').value;
            const struct = document.getElementById('structureFilter').value;
            const curatedOnly = document.getElementById('curatedOnly').checked;

            const filtered = vaultData.filter(map => {
                if (curatedOnly && !map.curated) return false;
                if (compendium !== 'all' && getCompendiumName(map) !== compendium) return false;
                if (era !== 'all' && !(map.eras || []).includes(era)) return false;
                if (env !== 'all' && !(map.environments || []).includes(env)) return false;
                if (struct !== 'all' && !(map.structures || []).includes(struct)) return false;

                if (query) {
                    const searchableText = [
                        map.title,
                        map.filename,
                        getCompendiumName(map),
                        map.summary,
                        map.lore,
                        ...(map.eras || []),
                        ...(map.environments || []),
                        ...(map.structures || []),
                        ...(map.features || []),
                        ...(map.shadow_shift_cues || [])
                    ].join(' ').toLowerCase();

                    if (!searchableText.includes(query)) return false;
                }

                return true;
            });

            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterMaps);
        document.getElementById('compendiumFilter').addEventListener('change', filterMaps);
        document.getElementById('eraFilter').addEventListener('change', filterMaps);
        document.getElementById('environmentFilter').addEventListener('change', filterMaps);
        document.getElementById('structureFilter').addEventListener('change', filterMaps);
        document.getElementById('curatedOnly').addEventListener('change', filterMaps);

        loadVault();
    </script>
</body>
</html>
